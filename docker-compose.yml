services:
  postgres:
    image: postgres:16-alpine
    container_name: diabetes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER est requis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB est requis}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - diabetes_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: diabetes_streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER est requis}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB est requis}
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - diabetes_net
    command: >
      sh -c "
      echo 'Lancement ETL...' &&
      python src/etl/load_to_postgres.py &&
      echo 'Entraînement du modèle...' &&
      python src/model/train.py &&
      echo 'Démarrage Streamlit...' &&
      streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
      "

networks:
  diabetes_net:
    driver: bridge

volumes:
  postgres_data:
